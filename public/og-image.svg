<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="g" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0B0B0C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#C9A96E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0B0C"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- Eyebrow -->
  <text x="600" y="160" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" letter-spacing="6"
        fill="#C9A96E" text-anchor="middle" opacity="0.85">SHARP / CUTS AI</text>

  <!-- Headline -->
  <text x="600" y="290" font-family="Bebas Neue, Impact, sans-serif" font-size="120" letter-spacing="2"
        fill="#F5F1E8" text-anchor="middle">THE SHARPEST CUTS,</text>
  <text x="600" y="410" font-family="Bebas Neue, Impact, sans-serif" font-size="120" letter-spacing="2"
        fill="url(#brass)" text-anchor="middle">POWERED BY AI.</text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="Inter, system-ui, sans-serif" font-size="26"
        fill="#F5F1E8" fill-opacity="0.7" text-anchor="middle">Booking · Style advice · Loyalty · Concierge</text>

  <!-- Barber pole rule -->
  <g transform="translate(0,602)">
    <rect width="1200" height="6" fill="#0B0B0C"/>
    <g>
      <rect x="0" width="16" height="6" fill="#D23A3A" transform="skewX(-30)"/>
    </g>
  </g>

  <!-- Scissors mark -->
  <g transform="translate(540,60)" fill="none" stroke="#C9A96E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="44" r="7"/>
    <circle cx="44" cy="44" r="7"/>
    <path d="M26 39 L52 14"/>
    <path d="M38 39 L12 14"/>
  </g>
</svg>
